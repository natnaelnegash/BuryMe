services:
  postgres:
    image: postgres:16-alpine
    container_name: buryme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buryme
      POSTGRES_PASSWORD: buryme_dev
      POSTGRES_DB: buryme
    ports:
      # Host port 5433, not 5432 — avoids clashing with other local Postgres
      # containers (5432 is the common default other projects also bind to).
      - "5433:5432"
    volumes:
      - buryme-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buryme"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  buryme-postgres-data:
